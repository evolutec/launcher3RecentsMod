name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: List available SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --list 2>/dev/null | grep -iE "platforms;android-3[0-9]|build-tools;3[0-9]" | head -40

      - name: Build APK
        run: chmod +x build.sh && ./build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher3mod-pixel-apk
          path: build/launcher3mod-pixel.apk

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/launcher3mod-pixel.apk
          generate_release_notes: true

      - name: Update "latest" release on main push
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: build/launcher3mod-pixel.apk
          generate_release_notes: false